name: Linux binaries

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable release tag (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      amd64_sha256: ${{ steps.archives.outputs.amd64_sha256 }}
      arm64_sha256: ${{ steps.archives.outputs.arm64_sha256 }}
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Validate release tag
        id: version
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_RELEASE_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable tag such as v0.1.0 (no prerelease or leading zeros).'
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$tag" "${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Verify tagged commit
        id: source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          commit=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          test "$(git rev-parse HEAD)" = "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check tagged installation inputs
        run: |
          for file in install.sh LICENSE THIRD_PARTY_NOTICES INSTALL.md packaging/systemd/tailhop.service packaging/systemd/tailhop.env.example; do
            if ! git cat-file -e "HEAD:$file"; then
              echo "::error::Release tag lacks $file; use a tag containing the self-contained installation files."
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Test distribution and installer
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build and verify archives
        id: archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git diff --exit-code HEAD -- cmd internal go.mod go.sum install.sh LICENSE THIRD_PARTY_NOTICES INSTALL.md packaging/systemd
          out="$RUNNER_TEMP/tailhop-linux-binaries"
          mkdir -p "$out"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          epoch=$(git show -s --format=%ct HEAD)
          files=(tailhop install.sh LICENSE THIRD_PARTY_NOTICES INSTALL.md packaging/systemd/tailhop.service packaging/systemd/tailhop.env.example)
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > "$work/expected-files"
          for arch in amd64 arm64; do
            stage="$work/$arch"
            mkdir -p "$stage"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "$stage/tailhop" ./cmd/tailhop
            test -s "$stage/tailhop"
            chmod 0755 "$stage/tailhop"
            info=$(go version -m "$stage/tailhop")
            printf '%s\n' "$info" | grep -Eq '^[[:space:]]*build[[:space:]]+GOOS=linux$'
            printf '%s\n' "$info" | grep -Eq "^[[:space:]]*build[[:space:]]+GOARCH=$arch$"
            printf '%s\n' "$info" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$'
            for file in "${files[@]:1}"; do
              install -D -m 0644 "$file" "$stage/$file"
            done
            chmod 0755 "$stage/install.sh"
            archive="$out/tailhop_${VERSION}_linux_${arch}.tar.gz"
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
              -C "$stage" -cf - "${files[@]}" | gzip -n > "$archive"
            tar -tzf "$archive" | LC_ALL=C sort > "$work/actual-files"
            cmp "$work/expected-files" "$work/actual-files"
            extracted="$work/extracted-$arch"
            mkdir -p "$extracted"
            tar --no-same-owner -xzf "$archive" -C "$extracted"
            test -s "$extracted/tailhop" && test -x "$extracted/tailhop"
            test -x "$extracted/install.sh"
            sh -n "$extracted/install.sh"
            sh "$extracted/install.sh" --help
            verify_files() {
              for file in "${files[@]}"; do
                test -f "$extracted/$file" && test ! -L "$extracted/$file" && \
                  cmp "$stage/$file" "$extracted/$file" || return 1
              done
            }
            verify_files
            for file in "${files[@]:1}"; do
              cmp "$file" "$extracted/$file"
            done
            # Prove byte comparison rejects corruption and a missing included file.
            printf '\nintegrity failure test\n' >> "$extracted/packaging/systemd/tailhop.env.example"
            if verify_files > "$work/corrupt.log" 2>&1; then
              echo '::error::File verification accepted a modified file'
              exit 1
            fi
            cp "$stage/packaging/systemd/tailhop.env.example" "$extracted/packaging/systemd/tailhop.env.example"
            rm "$extracted/THIRD_PARTY_NOTICES"
            if verify_files > "$work/missing.log" 2>&1; then
              echo '::error::File verification accepted a missing file'
              exit 1
            fi
            cp "$stage/THIRD_PARTY_NOTICES" "$extracted/THIRD_PARTY_NOTICES"
            verify_files
            hash=$(sha256sum "$archive")
            printf '%s_sha256=%s\n' "$arch" "${hash%% *}" >> "$GITHUB_OUTPUT"
            echo "Verified Linux $arch archive, tagged installation files, and integrity failure cases"
          done
      - name: Upload private build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailhop-linux-binaries-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/tailhop-linux-binaries/tailhop_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            ${{ runner.temp }}/tailhop-linux-binaries/tailhop_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: linux-draft-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      # Use this run's automation, even when the tagged source predates it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test draft release safety
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tailhop-linux-binaries-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/tailhop-linux-binaries
      - name: Create or update draft assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          AMD64_SHA256: ${{ needs.build.outputs.amd64_sha256 }}
          ARM64_SHA256: ${{ needs.build.outputs.arm64_sha256 }}
          ASSET_DIR: ${{ runner.temp }}/tailhop-linux-binaries
        run: python3 .github/scripts/draft_release.py
