name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_commit:
        description: 'Immutable source commit verified by the release build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Fuzz policy and proxy headers
        shell: bash
        run: |
          for target in FuzzAuthority FuzzPublicIP FuzzStripHeaders; do
            if ! go test ./internal/proxy -list "^${target}$" | grep -Fx "$target" > /dev/null; then
              echo "::error::Missing or unloadable required fuzz target: $target"
              exit 1
            fi
            go test ./internal/proxy -run='^$' -fuzz="^${target}$" -fuzztime=10s -parallel=2
          done
      - name: Race test
        run: go test -race ./...
      - name: Test distribution and installer
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned vulnerability scanner for the runner
        env:
          GOBIN: ${{ runner.temp }}/tailhop-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan release build configuration
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        # Keep text output: JSON/SARIF output does not fail on findings.
        run: '"$RUNNER_TEMP/tailhop-tools/govulncheck" ./...'
